# ============================================
# CONFIGURAÇÃO DO POSTGRESQL - RAILWAY
# ============================================
# URL de conexão ao PostgreSQL no Railway
# Conversão: DATABASE_URL (postgresql://user:pass@host:port/db)
# Para formato JDBC: jdbc:postgresql://host:port/db
spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.username=postgres
spring.datasource.password=EbbVxGATHNEZCtHxkJiJcyiGdYatEaWF
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURAÇÃO DO HIBERNATE/JPA
# ============================================
# ddl-auto=update: Cria/atualiza as tabelas automaticamente sem dropar dados existentes
spring.jpa.hibernate.ddl-auto=update

# Dialeto específico do PostgreSQL para melhor otimização
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostrar SQL em produção (desabilitar em produção real, apenas para debug)
spring.jpa.show-sql=false

# Format SQL gerado para melhor legibilidade
spring.jpa.properties.hibernate.format_sql=false

# Usar transações JDBC nativas para melhor performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
